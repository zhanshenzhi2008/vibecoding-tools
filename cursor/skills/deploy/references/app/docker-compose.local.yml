# =============================================================================
# 本地开发 Docker Compose 覆盖文件
# 用途：本地开发时构建镜像，不依赖远程仓库
#
# 使用方法：
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # 本地开发时覆盖（生产用 .env）
      - NODE_ENV=development
      - DEBUG=true
