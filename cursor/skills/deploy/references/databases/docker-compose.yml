# =============================================================================
# 通用数据库基础设施
# 用途：统一管理 PostgreSQL / Redis，独立于应用部署，多项目共用
# 部署位置：/opt/databases/
#
# 使用方法：
#   cp databases.env.example .env
#   vi .env 填入必填值（至少 POSTGRES_PASSWORD）
#   docker compose --env-file .env up -d
#
# 模板变量：
#   {{PROJECT_NAME}}  项目名（默认数据库名）
#   {{DB_NETWORK}}    网络名（默认 db-net）
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: db-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-{{PROJECT_NAME}}}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - {{DB_NETWORK}}
    profiles: ["postgres", "all"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Redis（缓存 + 会话）
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: db-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis-data:/data
    networks:
      - {{DB_NETWORK}}
    profiles: ["redis", "all"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# =============================================================================
# 网络 & 卷
# =============================================================================
networks:
  {{DB_NETWORK}}:
    driver: bridge
    name: {{DB_NETWORK}}

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
