# =============================================================================
# GitHub Actions CD 模板 #1：Docker Compose 部署
# 适用：Spring Boot + 前端，单台/少数服务器
# 用法：复制到 .github/workflows/cd.yml，改顶部 env 块
# =============================================================================

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      service:
        description: '选择部署服务'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - frontend

# 防并发部署：同一个 ref 排队
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # ── 镜像相关（env，公开信息，不放 Secret）────────────────────
  IMAGE_REGISTRY: ghcr.io                                        # ← 改 1：ghcr.io / registry.cn-hangzhou.aliyuncs.com
  IMAGE_NAMESPACE: ${{ github.repository_owner }}                # ← 改 2：仓库 owner / 命名空间
  IMAGE_PROJECT: YOUR_PROJECT_NAME                               # ← 改 3：项目名

  # ── 服务器部署路径（env）────────────────────────────────────
  DEPLOY_PATH: /opt/project/YOUR_PROJECT_NAME                   # ← 改 4：服务器上项目根目录
  COMPOSE_FILE: docker-compose.yml                               # 留默认即可，按需改
  COMPOSE_SERVICES: your-backend your-frontend                   # ← 改 5：compose.yml 里的服务名

jobs:
  # ---------------------------------------------------------------------------
  # 构建 + 推送镜像
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    environment: production      # ← 配 environment 要求人工审批（可选）

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.IMAGE_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.IMAGE_REGISTRY_TOKEN }}

      # ---------- 后端镜像（按需修改路径/Dockerfile） ----------
      - name: Build and push backend image
        if: github.event.inputs.service == 'all' || github.event.inputs.service == 'backend' || github.event.inputs.service == ''
        uses: docker/build-push-action@v6
        with:
          context: .                                            # ← 按需改
          file: ./YOUR_BACKEND_DIR/Dockerfile                   # ← 改 6
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_PROJECT }}-backend:${{ github.sha }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_PROJECT }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- 前端镜像 ----------
      - name: Build and push frontend image
        if: github.event.inputs.service == 'all' || github.event.inputs.service == 'frontend' || github.event.inputs.service == ''
        uses: docker/build-push-action@v6
        with:
          context: ./YOUR_FRONTEND_DIR                          # ← 改 7
          file: ./YOUR_FRONTEND_DIR/Dockerfile                  # ← 改 8
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_PROJECT }}-frontend:${{ github.sha }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_PROJECT }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 部署到远程服务器
  # ---------------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      # 私钥防呆：先验证 SSH key 是合法的、字节数合理
      # ⚠️ GitHub Secret UI 会 strip 末尾 \n，printf '%s\n' 保证文件以换行符结尾
      - name: Verify DEPLOY_SSH_KEY fingerprint
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "=== Key 校验 ==="
          wc -c ~/.ssh/deploy_key | awk '{print "字节数: " $1}'
          shasum -a 256 ~/.ssh/deploy_key | awk '{print "sha256: " $1}'
          ssh-keygen -l -f ~/.ssh/deploy_key | awk '{print "fingerprint: " $2 " (" $1 ")"}'

      - name: Deploy to remote server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          script: |
            set -e
            echo "=== SSH OK $(whoami)@$(hostname) ==="

            # 1. 登录镜像仓库
            docker login ${{ env.IMAGE_REGISTRY }} -u "${{ github.actor }}" --password-stdin <<< "${{ secrets.IMAGE_REGISTRY_TOKEN }}"

            # 2. 拉新镜像
            cd ${{ env.DEPLOY_PATH }}
            docker compose -f ${{ env.COMPOSE_FILE }} pull ${{ env.COMPOSE_SERVICES }}

            # 3. 滚动升级
            docker compose -f ${{ env.COMPOSE_FILE }} up -d ${{ env.COMPOSE_SERVICES }}

            # 4. 清理旧镜像（保留最近 3 个 tag）
            docker image prune -f --filter "until=72h"

            # 5. 健康检查
            sleep 30
            docker compose -f ${{ env.COMPOSE_FILE }} ps

      # 失败通知（可选）
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deploy failed"
          # 接 Slack / Discord / 邮件 webhook：
          # curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
          #   -H 'Content-Type: application/json' \
          #   -d '{"text":"❌ Deploy to production failed: ${{ github.run_id }}"}'