# =============================================================================
# GitHub Actions CD 模板 #2：K8s 部署
# 适用：EKS / AKS / 自建 K8s 集群
# 用法：复制到 .github/workflows/cd-k8s.yml，改 env + 替换 kubectl apply 命令
# =============================================================================

name: Deploy to K8s

on:
  push:
    branches:
      - main
    paths:
      - 'YOUR_BACKEND_DIR/**'   # ← 按需改
  workflow_dispatch:

concurrency:
  group: deploy-k8s-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  IMAGE_PROJECT: YOUR_PROJECT_NAME
  K8S_NAMESPACE: production    # ← 改 1
  K8S_DEPLOYMENT: my-backend   # ← 改 2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.IMAGE_REGISTRY_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./YOUR_BACKEND_DIR/Dockerfile   # ← 改 3
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_PROJECT }}/backend:${{ github.sha }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_PROJECT }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v5

      # 配置 kubectl（k8s cluster 的 kubeconfig 必须放 secret）
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.K8S_KUBECONFIG }}" | base64 -d > ~/.kube/config

      # 方案 A：kubectl set image（推荐，零停机滚动更新）
      - name: Set image and rollout
        run: |
          kubectl set image deployment/${{ env.K8S_DEPLOYMENT }} \
            backend=${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_PROJECT }}/backend:${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }}

          kubectl rollout status deployment/${{ env.K8S_DEPLOYMENT }} \
            -n ${{ env.K8S_NAMESPACE }} --timeout=5m

      # 方案 B：kubectl apply -f（如果你用 Kustomize / Helm，先 helm upgrade）
      # - name: Apply manifests
      #   run: |
      #     kubectl apply -f k8s/ -n ${{ env.K8S_NAMESPACE }}